# High-Performance Kafka Consumer Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.consumer.group-id=simple
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Performance Optimizations for Async Operations
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.fetch-max-wait=500ms
spring.kafka.consumer.fetch-min-size=1024
spring.kafka.consumer.session-timeout=30000ms
spring.kafka.consumer.heartbeat-interval=10000ms

# Batch Processing for Higher Throughput
spring.kafka.listener.type=batch
spring.kafka.consumer.max-poll-interval=600000ms

# Connection Pool Optimizations
spring.kafka.consumer.connections-max-idle=300000ms
spring.kafka.consumer.request-timeout=60000ms

# Memory Optimizations
spring.kafka.consumer.receive-buffer=65536
spring.kafka.consumer.send-buffer=131072
spring.kafka.consumer.buffer-memory=33554432
spring.threads.virtual.enabled=true
# Database Performance - FIXED CONNECTION POOL SETTINGS
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microfinance_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:localpass123}
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JPA Optimizations for Async Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Transaction Management
spring.jpa.open-in-view=false
spring.transaction.rollback-on-commit-failure=true

# Async Execution Configuration - REDUCED TO PREVENT CONNECTION POOL EXHAUSTION
spring.task.execution.pool.core-size=50
spring.task.execution.pool.max-size=100
spring.task.execution.pool.queue-capacity=500
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=async-exec-

# Logging (disable verbose logging for performance)
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN